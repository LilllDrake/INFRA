- name: Применить отложенные перезапуски до проверки
  ansible.builtin.meta: flush_handlers   

- name: Дождаться, пока OpenSearch ответит через API
  ansible.builtin.uri:
    url: "https://localhost:{{ opensearch_http_port }}/_cluster/health"
    user: admin
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true    # сразу отправить логин и пароль
    validate_certs: false     # сертификат самоподписанный (как -k у curl)
  register: opensearch_health # сохранить ответ в переменную
  until: opensearch_health.json is defined and opensearch_health.json.status in ['green', 'yellow']
  retries: "{{ opensearch_healthcheck_retries }}"   # сколько попыток
  delay: "{{ opensearch_healthcheck_delay }}"       # пауза между попытками, сек
  changed_when: false         # проверка ничего не меняет на ВМ - ответ всегда ок
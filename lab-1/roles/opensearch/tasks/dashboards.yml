- name: Подключить APT-репозиторий OpenSearch Dashboards
  ansible.builtin.deb822_repository:
    name: opensearch-dashboards-3.x
    types: deb
    uris: "{{ opensearch_dashboards_repo_url }}"
    suites: stable
    components: main
    signed_by: "{{ opensearch_gpg_key_path }}"   # пакеты подписаны тем же ключом
    state: present

- name: Установить OpenSearch Dashboards нужной версии
  ansible.builtin.apt:
    name: "opensearch-dashboards={{ opensearch_dashboards_version }}"
    state: present
    update_cache: true

- name: Положить конфиг Dashboards из шаблона
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_dashboards_path_config }}/opensearch_dashboards.yml"
    owner: root
    group: opensearch-dashboards
    mode: "0640"    
  notify: restart dashboards

- name: Включить автозапуск и запустить Dashboards
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    enabled: true          # стартует после ребута
    state: started
    daemon_reload: true    # пакет добавил новый сервис, systemd должен его увидеть